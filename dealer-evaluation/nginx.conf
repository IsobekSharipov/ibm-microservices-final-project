server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/products {
        proxy_pass http://product-details:5000/products;
        proxy_set_header Host $host;
    }

    location /api/dealer-pricing {
        proxy_pass http://dealer-pricing:3000/dealer-pricing;
        proxy_set_header Host $host;
    }
}
