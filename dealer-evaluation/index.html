<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dealer Evaluation</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 850px; margin: 3rem auto; padding: 0 1.5rem; line-height: 1.5; }
    button, select { padding: .6rem 1rem; cursor: pointer; font: inherit; }\n    label { display: block; margin: 1.5rem 0 .4rem; font-weight: 600; }
    pre { background: #f4f4f4; padding: 1rem; white-space: pre-wrap; border-radius: .4rem; }
    .row { display: flex; gap: 1rem; flex-wrap: wrap; }
  </style>
</head>
<body>
  <main>
    <h1>Dealer Evaluation</h1>
    <p>View product details and dealer prices from their microservices.</p>
    <label for="product-select">Select a product</label>\n    <select id="product-select" aria-label="Products" disabled>\n      <option value="">Loading products...</option>\n    </select>\n    <p id="product-status" role="status">Loading products from Product Details service...</p>\n    <div class="row">
      <button id="load-products">Load products</button>
      <button id="load-pricing">Load dealer pricing</button>
    </div>
    <h2>API response</h2>
    <pre id="result" aria-live="polite">Choose an action above.</pre>
  </main>
  <script>
    // Question 4: API endpoint placeholders updated to the Kubernetes services.
    // Frontend uses same-origin URLs; the Nginx proxy routes these to
    // http://product-details:5000 and http://dealer-pricing:3000.
    const PRODUCT_DETAILS_API_URL = "/api/products";
    const DEALER_PRICING_API_URL = "/api/dealer-pricing";

    async function preloadProducts() {
      const dropdown = document.getElementById("product-select");
      const status = document.getElementById("product-status");
      try {
        const response = await fetch(PRODUCT_DETAILS_API_URL);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const products = await response.json();
        if (!Array.isArray(products)) throw new Error("Invalid product list");
        dropdown.replaceChildren();
        const prompt = document.createElement("option");
        prompt.value = "";
        prompt.textContent = "Choose a product";
        dropdown.appendChild(prompt);
        for (const product of products) {
          const option = document.createElement("option");
          option.value = String(product.id);
          option.textContent = product.name;
          dropdown.appendChild(option);
        }
        dropdown.disabled = products.length === 0;
        status.textContent = `${products.length} products loaded successfully.`;
      } catch (error) {
        dropdown.replaceChildren();
        const option = document.createElement("option");
        option.textContent = "Products unavailable";
        dropdown.appendChild(option);
        dropdown.disabled = true;
        status.textContent = `Could not load products: ${error.message}`;
      }
    }

    async function showData(endpoint) {
      const output = document.getElementById("result");
      output.textContent = "Loading...";
      try {
        const response = await fetch(endpoint);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        output.textContent = JSON.stringify(data, null, 2);
      } catch (error) {
        output.textContent = `Request failed: ${error.message}`;
      }
    }

    document.getElementById("product-select").addEventListener("change", (event) => {
      if (event.target.value) {
        showData(`${PRODUCT_DETAILS_API_URL}/${encodeURIComponent(event.target.value)}`);
      }
    });

    preloadProducts();

    document.getElementById("load-products").addEventListener("click", () => {
      showData(PRODUCT_DETAILS_API_URL);
    });
    document.getElementById("load-pricing").addEventListener("click", () => {
      showData(DEALER_PRICING_API_URL);
    });
  </script>
</body>
</html>
